<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kasukabe Defense Stickers</title>
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #16161a; color: #eee; font-family: Roboto, Arial, sans-serif; padding: 24px;
  }
  .card {
    max-width: 420px; width: 100%; background: #1f1f24; border-radius: 16px; padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); text-align: center;
  }
  .imgwrap {
    background: #2a2a31; border-radius: 12px; padding: 16px; margin-bottom: 16px;
    min-height: 160px; display: flex; align-items: center; justify-content: center;
  }
  .imgwrap img { max-width: 100%; max-height: 260px; border-radius: 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .name { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #999; margin: 0 0 20px; }
  .cta {
    background: #3a2f00; border: 1px solid #4a3d00; border-radius: 10px;
    padding: 14px 16px; font-size: 13px; line-height: 1.5; color: #ffd36b; text-align: left;
  }
  .cta a {
    display: inline-block; margin-top: 10px; background: #FFB020; color: #1a1200;
    font-weight: 700; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 13px;
  }
  .cta a:hover { filter: brightness(1.08); }
  .foot { margin-top: 16px; font-size: 11px; color: #666; }
  .spinner { color: #888; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="imgwrap" id="imgwrap"><span class="spinner">Loading…</span></div>
    <div class="name" id="name"></div>
    <p class="sub">a sticker sent in Google Meet chat</p>
    <div class="cta">
      🩹 This was sent with the <b>Kasukabe Defense Stickers</b> extension. Install
      it to see stickers like this directly inline in your own Meet chat, instead
      of a link.
      <br />
      <a id="install" href="#" target="_blank" rel="noopener">Get the extension</a>
    </div>
    <div class="foot" id="foot"></div>
  </div>

  <script>
    (function () {
      var GH_USER = "kasukabe-defense-group";
      var REPO = "kasukabe-defense-stickers";
      var BRANCH = "main";
      var INDEX_URL = "extension/stickers/index.json"; // relative: served by GitHub Pages from this same repo
      var RELEASE_URL = "https://github.com/" + GH_USER + "/" + REPO + "/releases/latest";

      document.getElementById("install").href = RELEASE_URL;

      var params = new URLSearchParams(location.search);
      var pack = params.get("p");
      var id = params.get("i");
      var imgwrap = document.getElementById("imgwrap");
      var nameEl = document.getElementById("name");
      var foot = document.getElementById("foot");

      function showError(msg) {
        imgwrap.innerHTML = "";
        var span = document.createElement("span");
        span.className = "spinner";
        span.textContent = msg;
        imgwrap.appendChild(span);
      }

      if (!pack || !id) {
        showError("No sticker specified.");
        return;
      }

      fetch(INDEX_URL, { cache: "no-cache" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          var st = (data.stickers || []).find(function (s) { return s.pack === pack && s.id === id; });
          if (!st) { showError("Sticker not found (it may have been renamed or removed)."); return; }
          var img = document.createElement("img");
          img.alt = st.name || st.id;
          img.src = "extension/stickers/" + st.file;
          imgwrap.innerHTML = "";
          imgwrap.appendChild(img);
          nameEl.textContent = st.name || st.id;
        })
        .catch(function (e) {
          showError("Couldn't load the sticker library.");
          foot.textContent = String(e && e.message || e);
        });
    })();
  </script>
</body>
</html>
